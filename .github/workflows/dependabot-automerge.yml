name: dependabot auto-merge

# Turns on GitHub's auto-merge for low-risk Dependabot PRs: the Debian base
# image digest and the pinned GitHub Actions. They merge only after the build
# AND the vulnerability scan pass (required checks on main).
# Python library updates (pip) are NOT auto-merged: they wait for a person.
on: pull_request

permissions:
  contents: read

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Enable auto-merge (docker + github-actions only)
        if: steps.meta.outputs.package-ecosystem == 'docker' || steps.meta.outputs.package-ecosystem == 'github_actions'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
