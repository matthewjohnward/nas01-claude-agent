# Dependabot. cooldown = wait 7 days after a release before proposing it
# (gives the world time to spot a compromised release).
# - docker + github-actions: weekly version PRs; auto-merged after build + scan pass.
# - pip (agent/requirements.txt): SECURITY fixes only (version PRs are off with
#   open-pull-requests-limit 0); never auto-merged; unraid-mcp upgrades are done
#   by hand after a review.
version: 2
updates:
  - package-ecosystem: docker
    directories: ["/agent", "/proxy"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      base-image:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: "/agent"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 0
